# Railway monorepo config (Railpack v0.39.0)
# 2 services dalam 1 repo: backend + frontend
# Setiap service pakai rootDirectory agar Railpack analisis subdir yang benar

[project]
name = "chatbot-assistant"

# ============ BACKEND SERVICE ============
[[services]]
name = "backend"
rootDirectory = "backend"

[services.build]
builder = "RAILPACK"

[services.deploy]
startCommand = "node src/server.js"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# ============ FRONTEND SERVICE ============
[[services]]
name = "frontend"
rootDirectory = "frontend"

[services.build]
builder = "RAILPACK"

[services.deploy]
startCommand = "node server.js"
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
